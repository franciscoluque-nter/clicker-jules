<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cookie Clicker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #fceabb 0%, #f8b500 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      overflow-x: hidden;
      color: #3e2723;
      padding: 1rem;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      max-width: 600px;
      width: 100%;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      color: #4e342e;
      text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.6);
    }

    .counter-display {
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 1.5rem;
      background: rgba(255, 255, 255, 0.85);
      padding: 0.5rem 1.5rem;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(5px);
    }

    .cookie-wrapper {
      position: relative;
      cursor: pointer;
      display: inline-block;
      margin-bottom: 1.5rem;
    }

    .cookie {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #e6a756, #b06d28);
      box-shadow:
        inset -10px -10px 20px rgba(0,0,0,0.3),
        inset 5px 5px 10px rgba(255,255,255,0.4),
        0 10px 25px rgba(0, 0, 0, 0.2);
      position: relative;
      transition: transform 0.1s ease-in-out;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Chocolate Chips */
    .chip {
      position: absolute;
      background-color: #3d2314;
      border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
      box-shadow: inset 1px 1px 2px rgba(255,255,255,0.2), 1px 1px 2px rgba(0,0,0,0.4);
    }

    .chip-1 { width: 28px; height: 24px; top: 35px; left: 50px; transform: rotate(15deg); }
    .chip-2 { width: 32px; height: 28px; top: 40px; right: 45px; transform: rotate(-25deg); }
    .chip-3 { width: 26px; height: 26px; top: 95px; left: 30px; transform: rotate(45deg); }
    .chip-4 { width: 34px; height: 30px; top: 100px; right: 35px; transform: rotate(10deg); }
    .chip-5 { width: 30px; height: 26px; bottom: 35px; left: 60px; transform: rotate(-15deg); }
    .chip-6 { width: 28px; height: 28px; bottom: 40px; right: 55px; transform: rotate(35deg); }
    .chip-7 { width: 32px; height: 28px; top: 85px; left: 95px; transform: rotate(70deg); }

    .cookie-wrapper:active .cookie {
      transform: scale(0.92);
    }

    .cookie-wrapper:hover .cookie {
      box-shadow:
        inset -10px -10px 20px rgba(0,0,0,0.3),
        inset 5px 5px 10px rgba(255,255,255,0.4),
        0 15px 30px rgba(0, 0, 0, 0.3);
    }

    /* Floating +1 Popups */
    .floating-text {
      position: absolute;
      font-size: 1.8rem;
      font-weight: bold;
      color: #3d2314;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
      text-shadow: 0 2px 4px rgba(255, 255, 255, 0.8);
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-60px) scale(1.3);
      }
    }

    /* Achievements Section */
    .achievements-section {
      width: 100%;
      background: rgba(255, 255, 255, 0.75);
      border-radius: 20px;
      padding: 1rem;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(5px);
      margin-bottom: 1.5rem;
    }

    .achievements-section h2 {
      font-size: 1.3rem;
      color: #4e342e;
      margin-bottom: 0.8rem;
    }

    .trophies-grid {
      display: flex;
      justify-content: space-around;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .trophy-card {
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid #d7ccc8;
      border-radius: 12px;
      padding: 0.8rem 0.5rem;
      flex: 1;
      min-width: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.3s ease;
      opacity: 0.5;
      filter: grayscale(100%);
    }

    .trophy-card.unlocked {
      opacity: 1;
      filter: grayscale(0%);
      border-color: #ffb300;
      box-shadow: 0 4px 12px rgba(255, 179, 0, 0.3);
      background: #fff8e1;
      transform: translateY(-2px);
    }

    .trophy-icon {
      font-size: 2rem;
      margin-bottom: 0.3rem;
    }

    .trophy-title {
      font-weight: bold;
      font-size: 0.9rem;
      color: #4e342e;
    }

    .trophy-desc {
      font-size: 0.75rem;
      color: #6d4c41;
      margin-top: 0.2rem;
    }

    .trophy-status {
      font-size: 0.75rem;
      font-weight: bold;
      margin-top: 0.4rem;
      color: #8d6e63;
    }

    .trophy-card.unlocked .trophy-status {
      color: #2e7d32;
    }

    .controls {
      margin-top: 0.5rem;
    }

    .reset-btn {
      background-color: #8d6e63;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      font-size: 0.9rem;
      border-radius: 20px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .reset-btn:hover {
      background-color: #6d4c41;
    }

    .reset-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Cookie Clicker</h1>
    <div class="counter-display">
      Clicks: <span id="click-count">0</span>
    </div>

    <div class="cookie-wrapper" id="cookie-btn" aria-label="Clickable Cookie">
      <div class="cookie">
        <div class="chip chip-1"></div>
        <div class="chip chip-2"></div>
        <div class="chip chip-3"></div>
        <div class="chip chip-4"></div>
        <div class="chip chip-5"></div>
        <div class="chip chip-6"></div>
        <div class="chip chip-7"></div>
      </div>
    </div>

    <!-- Achievements Panel -->
    <div class="achievements-section">
      <h2>🏆 Achievements</h2>
      <div class="trophies-grid">
        <div class="trophy-card" id="trophy-10">
          <div class="trophy-icon">🥉</div>
          <div class="trophy-title">Bronze Cookie</div>
          <div class="trophy-desc">10 Clicks</div>
          <div class="trophy-status" id="status-10">Locked 🔒</div>
        </div>
        <div class="trophy-card" id="trophy-100">
          <div class="trophy-icon">🥈</div>
          <div class="trophy-title">Silver Cookie</div>
          <div class="trophy-desc">100 Clicks</div>
          <div class="trophy-status" id="status-100">Locked 🔒</div>
        </div>
        <div class="trophy-card" id="trophy-1000">
          <div class="trophy-icon">🥇</div>
          <div class="trophy-title">Gold Cookie</div>
          <div class="trophy-desc">1000 Clicks</div>
          <div class="trophy-status" id="status-1000">Locked 🔒</div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="reset-btn" id="reset-btn">Reset Counter</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
